<script>
const S = {"label": "المتبقي على الزواج", "today": "حان موعد الزواج", "one": "يوم واحد", "two": "يومان", "few": "أيام", "many": "يوم"};
const TARGET = Date.UTC(2026, 10, 6);
function daysLeft() {
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Riyadh', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date()).split('-').map(Number);
  return Math.round((TARGET - Date.UTC(p[0], p[1]-1, p[2])) / 86400000);
}
const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
function render() {
  const n = daysLeft(), cd = document.getElementById('cd'), lbl = document.getElementById('lbl'),
        num = document.getElementById('num'), word = document.getElementById('word');
  if (n < 0) { cd.hidden = true; return; }
  cd.hidden = false;
  lbl.textContent = n === 0 ? S.today : S.label;
  num.textContent = ''; word.textContent = '';
  if (n === 0) return;
  if (n === 1) word.textContent = S.one;
  else if (n === 2) word.textContent = S.two;
  else { num.textContent = ar(n); word.textContent = n <= 10 ? S.few : S.many; }
}
render();
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
</script>
